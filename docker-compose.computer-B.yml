services:
  sender:
    container_name: sender-app
    build:
      context: .
    env_file:
      - .env
    command: node src/${SENDER_SCRIPT}
    # networks:
    #   - experiment-net
    ports:
      - "${WS_SERVER_PORT}:${WS_SERVER_PORT}"
    network_mode: host
    volumes:
      - ./notebook/data:/app/src/data
    cpus: '2.0'
    mem_limit: 2g